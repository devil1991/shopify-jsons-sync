name: 'Shopify Theme JSON Syncs'
description: 'Sync Shopify Theme JSONs'
author: 'devil1991'
inputs:
  store:
    required: true
    description: 'Store'

  theme:
    required: true
    description: 'Target Theme ID (where synced files will be pushed to)'

  source-theme:
    required: false
    description: 'Source Theme ID to sync JSON files from (if not provided, syncs from live theme)'

  working-directory:
    required: false
    description: 'Working Directory'

  allow-published:
    required: false
    description: 'Allow production theme to be modified'
    default: 'false'
runs:
  main: 'dist/index.js'
  using: 'node20'
